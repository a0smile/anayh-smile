# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: a0smile/anayh-smile
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/bc92069e-6d76-4a6b-9ddb-7c3937ae10ba/pkce
  auth_token_endpoint: /sites/bc92069e-6d76-4a6b-9ddb-7c3937ae10ba/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://smi1e.pages.dev

# مجلدات حفظ وإدارة الصور في الموقع الحالي للمجمع
media_folder: "images"
public_folder: "/images"

# الهيكلة الاحترافية للتحكم بملفات مجمع عناية الابتسامة
collections:
  - name: "pages"
    label: "صفحات الموقع"
    files:
      # ربط لوحة التحكم بملف البيانات الأساسي لتعديله مرئياً
      - file: "content.json"
        label: "تعديل محتوى وملفات البيانات"
        name: "site_content"
        fields:
          - label: "البيانات البرمجية (JSON)"
            name: "json_data"
            widget: "code"
            default_language: "json"

      # ربط لوحة التحكم بصفحة الكتالوج لتحديثها
      - file: "catalog.html"
        label: "صفحة الكتالوج العامة"
        name: "catalog_page"
        fields:
          - label: "كود الصفحة الكامل"
            name: "catalog_body"
            widget: "code"
            default_language: "html"
