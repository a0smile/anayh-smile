  <style>
    /* ===== صفحة الكتالوج احترافية ===== */
    .catalog-page { padding: 120px 0 60px; min-height: 80vh; }
    .catalog-head { text-align: center; margin-bottom: 44px; }
    .catalog-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary,#007a3d), var(--primary-dark,#006c35));
      color: #fff; font-weight: 800; font-size: 0.85rem;
      padding: 6px 18px; border-radius: 30px; margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,108,53,.35);
    }
    .catalog-title { font-size: 2.2rem; font-weight: 900; color: var(--text,#134e4a); margin-bottom: 8px; }
    .catalog-subtitle { color: var(--text-light,#4b7285); font-size: 1.05rem; }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 26px;
    }
    .catalog-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 12px 30px rgba(13,148,136,.14);
      border: 3px solid transparent;
      background-clip: padding-box;
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .catalog-item:hover { transform: translateY(-6px); box-shadow: 0 20px 45px rgba(13,148,136,.25); }
    /* براويز مميزة متدرجة */
    .catalog-item::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: 17px;
      padding: 3px;
      background: linear-gradient(135deg, #5eead4, #0d9488, #f59e0b);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 2;
    }
    .catalog-img-wrap { position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #e6fffa; }
    .catalog-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
    .catalog-item:hover .catalog-img { transform: scale(1.06); }
    .catalog-placeholder {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; color: #6b8b85;
      background: linear-gradient(135deg, #f0fdfa, #ccfbf1);
    }
    .catalog-placeholder-icon { font-size: 3rem; opacity: .6; }
    .catalog-caption {
      position: absolute; bottom: 0; right: 0; left: 0;
      padding: 26px 14px 12px;
      background: linear-gradient(transparent, rgba(13,148,136,.9));
      color: #fff; font-weight: 800; font-size: 1rem; text-align: right;
    }
    .catalog-empty {
      grid-column: 1 / -1; text-align: center; padding: 60px 20px;
      color: var(--text-light,#4b7285); background: #f8fffd;
      border: 2px dashed #b7e6de; border-radius: 20px; font-size: 1.05rem;
    }
    .catalog-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .catalog-bar-btn {
      border: 1px solid var(--primary,#0d9488); color: var(--primary,#0d9488);
      background: #fff; font-family: inherit; font-weight: 800; font-size: .9rem;
      padding: 9px 18px; border-radius: 30px; cursor: pointer; transition: all .2s ease;
    }
    .catalog-bar-btn:hover { background: var(--primary,#0d9488); color: #fff; }
    /* أزرار تعديل داخل كل صورة (تظهر في وضع المالك) */
    .catalog-tools {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 5;
      display: none; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
    }
    body.admin-mode .catalog-tools { display: flex; }
    .catalog-tools button {
      border: none; font-family: inherit; font-size: .72rem; font-weight: 800;
      padding: 5px 10px; border-radius: 16px; cursor: pointer; color: #1f2937;
      box-shadow: 0 3px 10px rgba(0,0,0,.25); transition: transform .15s ease;
    }
    .catalog-tools button:hover { transform: scale(1.07); }
    .ctool-img { background: #f59e0b; }
    .ctool-del { background: #ef4444; color: #fff; }
    .ctool-shape { background: #8b5cf6; color: #fff; }
    .ctool-size { background: #10b981; color: #fff; }
    /* شكل الصورة */
    .shape-square { }
    .shape-circle { border-radius: 50% !important; }
    .shape-round { border-radius: 28px; }
    /* ردود الفعل فردية */
    @media (max-width: 1000px) { .catalog-grid { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 768px) { .catalog-grid { grid-template-columns: repeat(2,1fr); } .catalog-title{font-size:1.7rem;} }
    @media (max-width: 480px) { .catalog-grid { grid-template-columns: 1fr; } }
  </style>
</head>
